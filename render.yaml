services:
  - type: web
    name: studypilot-api
    runtime: node
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: "7d"
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: CLIENT_URL
        sync: false
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health