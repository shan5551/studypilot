services:
  - type: web
    name: studypilot
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    # Builds the API deps, then the React client (for static serving).
    buildCommand: npm install --include=dev && cd ../client && npm install --include=dev && CI=false npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: "7d"
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: openai
      # Free AI via Groq (OpenAI-compatible endpoint)
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      # Note: all Llama models on Groq moved to Enterprise-only (Sep 2026).
      # openai/gpt-oss-20b is self-serve/free-tier.
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: CLIENT_URL
        sync: false
      # Google OAuth (set these to enable "Continue with Google")
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Email (verification + password reset). Without these, emails are
      # printed to the server log instead of sent, so registration still works.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_FROM
        sync: false
    healthCheckPath: /api/health
    # Free plan spins down after inactivity — the first request may be slow.